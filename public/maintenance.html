<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Em manutenção</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, Segoe UI, Roboto;
    }
    .card {
      max-width: 720px;
      padding: 32px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      margin: 0;
      font-size: 16px;
      opacity: .9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Manutenção programada</h1>
    <p>Estamos realizando melhorias. Voltaremos em breve.</p>
  </div>
</body>
</html>
